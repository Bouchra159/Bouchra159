name: river-masks
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip

  # Core scientific
  - numpy>=1.26
  - pandas>=2.1
  - scipy>=1.11

  # Geospatial
  - rasterio>=1.3
  - geopandas>=0.14
  - shapely>=2.0
  - pyproj>=3.6
  - fiona>=1.9
  - cartopy>=0.22
  - xarray>=2023.12
  - rioxarray>=0.15

  # Visualization
  - matplotlib>=3.8
  - seaborn>=0.13
  - folium>=0.15
  - plotly>=5.17

  # Machine learning
  - scikit-learn>=1.3
  - scikit-image>=0.22

  # Jupyter
  - jupyterlab>=4.0
  - ipywidgets>=8.1
  - ipykernel>=6.27
  - nbformat>=5.9

  # Utilities
  - tqdm>=4.66
  - python-dotenv>=1.0
  - pyyaml>=6.0

  # Dev tools
  - pytest>=7.4
  - black>=23.11
  - flake8>=6.1

  - pip:
    # GEE packages not available via conda-forge
    - earthengine-api>=0.1.370
    - geemap>=0.30.0
